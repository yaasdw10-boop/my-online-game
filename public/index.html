<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asura Online - Full UI & Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #1b2612; overflow: hidden; touch-action: none; font-family: Tahoma, sans-serif; user-select: none; }
        
        /* UI มุมซ้ายบน */
        #ui-top-left { position: fixed; top: 8px; left: 8px; background: rgba(0,0,0,0.85); border: 2px solid #555; border-radius: 4px; padding: 6px 10px; color: #fff; font-size: 11px; z-index: 20; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .bar-container { background: #333; height: 7px; border-radius: 2px; margin-top: 2px; position: relative; overflow: hidden; border: 1px solid #111; }
        #hp-bar { background: #e74c3c; width: 100%; height: 100%; }
        #sp-bar { background: #3498db; width: 100%; height: 100%; }
        #exp-bar { background: #2ecc71; width: 15%; height: 100%; }
        
        /* Minimap ขวาบน */
        #minimap { position: fixed; top: 8px; right: 8px; width: 100px; height: 80px; background: rgba(15,23,42,0.9); border: 2px solid #475569; border-radius: 4px; z-index: 20; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 9px; text-align: center; }

        /* กล่องแชทโลก (ล่างซ้าย) */
        #chat-container { position: fixed; bottom: 45px; left: 8px; width: 260px; height: 90px; background: rgba(0,0,0,0.75); border: 1px solid #444; border-radius: 4px; padding: 4px; z-index: 25; display: flex; flex-direction: column; justify-content: flex-end; }
        #chat-box { font-size: 10px; color: #fff; overflow-y: auto; max-height: 60px; margin-bottom: 3px; word-break: break-all; }
        #chat-input-row { display: flex; gap: 4px; }
        #chat-input { flex: 1; background: rgba(255,255,255,0.9); border: none; border-radius: 2px; padding: 3px 5px; font-size: 10px; outline: none; }
        #chat-send { background: #2563eb; color: #fff; border: none; border-radius: 2px; padding: 3px 8px; font-size: 10px; cursor: pointer; font-weight: bold; }

        /* จอยสติ๊กซ้ายล่าง (ขยับขึ้นมาหลบแชทนิดหน่อย) */
        #joystick { position: fixed; bottom: 145px; left: 20px; width: 100px; height: 100px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; z-index: 25; display: flex; align-items: center; justify-content: center; touch-action: none; }
        #knob { width: 40px; height: 40px; background: rgba(255,255,255,0.4); border-radius: 50%; position: absolute; pointer-events: none; }

        /* ปุ่มโจมตี (มุมขวาล่าง) */
        #action-btn { position: fixed; bottom: 45px; right: 20px; width: 70px; height: 70px; background: linear-gradient(to bottom, #e74c3c, #c0392b); border: 3px solid #ff9f43; border-radius: 50%; z-index: 25; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }

        /* แถบเมนูลัดด้านล่างสุด */
        #bottom-menu { position: fixed; bottom: 0; left: 0; right: 0; height: 38px; background: linear-gradient(to top, #111, #222); border-top: 2px solid #444; display: flex; align-items: center; justify-content: space-around; z-index: 20; padding: 0 4px; }
        .menu-btn { background: #333; color: #facc15; border: 1px solid #555; border-radius: 3px; padding: 3px 6px; font-size: 9px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui-top-left">
        <div><b>[Novice]</b> <span id="ui-name">Hero</span> | <span style="color:#facc15;">LV. 1</span></div>
        <div style="font-size:9px; color:#aaa; margin-top:2px;">HP: 100/100</div>
        <div class="bar-container"><div id="hp-bar"></div></div>
        <div style="font-size:9px; color:#aaa; margin-top:2px;">SP: 50/50</div>
        <div class="bar-container"><div id="sp-bar"></div></div>
        <div style="font-size:9px; color:#2ecc71; margin-top:2px;">EXP: 15%</div>
        <div class="bar-container"><div id="exp-bar"></div></div>
    </div>

    <div id="minimap">📍 Prontera Field</div>

    <!-- กล่องแชทโลก (ล่างซ้าย) -->
    <div id="chat-container">
        <div id="chat-box">
            <div>[ระบบ]: ยินดีต้อนรับสู่โลก MMORPG!</div>
        </div>
        <div id="chat-input-row">
            <input type="text" id="chat-input" placeholder="พิมพ์คุยกับเพื่อน...">
            <button id="chat-send" onclick="sendChat()">ส่ง</button>
        </div>
    </div>

    <!-- จอยสติ๊กซ้ายล่าง -->
    <div id="joystick"><div id="knob"></div></div>

    <!-- ปุ่มโจมตีขวาล่าง -->
    <div id="action-btn" onclick="triggerAttack()">⚔️ โจมตี</div>

    <div id="bottom-menu">
        <button class="menu-btn" onclick="alert('กระเป๋า')">📦 กระเป๋า</button>
        <button class="menu-btn" onclick="alert('สเตตัส')">📊 สเตตัส</button>
        <button class="menu-btn" onclick="alert('สกิล')">⚡ สกิล</button>
        <button class="menu-btn" onclick="alert('ปาร์ตี้')">👥 ปาร์ตี้</button>
        <button class="menu-btn" onclick="alert('ตั้งค่า')">⚙️ ตั้งค่า</button>
    </div>

<script>
let globalSocket = null;

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }
    
    preload() {
        this.load.spritesheet('novice', 'https://labs.phaser.io/assets/animations/dude.png', { frameWidth: 32, frameHeight: 48 });
        this.load.image('bg', 'https://labs.phaser.io/assets/skies/space3.png');
    }

    create() {
        this.add.tileSprite(0, 0, 5000, 5000, 'bg').setAlpha(0.6);

        this.anims.create({
            key: 'walk',
            frames: this.anims.generateFrameNumbers('novice', { start: 0, end: 3 }),
            frameRate: 10,
            repeat: -1
        });
        this.anims.create({
            key: 'idle',
            frames: [{ key: 'novice', frame: 4 }],
            frameRate: 10
        });
        this.anims.create({
            key: 'attack',
            frames: [{ key: 'novice', frame: 5 }, { key: 'novice', frame: 6 }, { key: 'novice', frame: 4 }],
            frameRate: 12,
            repeat: 0
        });

        this.socket = io();
        globalSocket = this.socket; // ผูกไว้กับตัวแปรกลางเพื่อใช้ส่งแชท
        
        this.otherPlayers = this.physics.add.group();
        this.moveDir = { x: 0, y: 0 };
        this.cameras.main.setZoom(1.4);

        this.socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === this.socket.id) this.addPlayer(players[id]);
                else this.addOther(players[id]);
            });
        });

        this.socket.on('newPlayer', (playerInfo) => this.addOther(playerInfo));
        this.socket.on('disconnectPlayer', (id) => {
            this.otherPlayers.getChildren().forEach(o => { if (o.playerId === id) o.destroy(); });
        });
        this.socket.on('playerMoved', (playerInfo) => {
            this.otherPlayers.getChildren().forEach(o => {
                if (o.playerId === playerInfo.id) {
                    o.setPosition(playerInfo.x, playerInfo.y);
                    o.anims.play('walk', true);
                }
            });
        });

        // รับข้อความแชทจากเซิร์ฟเวอร์
        this.socket.on('chatMessage', (data) => {
            let box = document.getElementById('chat-box');
            box.innerHTML += `<div><b>${data.name}:</b> ${data.msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        // จอยสติ๊กบังคับทิศทาง
        let joy = document.getElementById('joystick'), knob = document.getElementById('knob');
        let active = false, maxD = 35;

        joy.onpointerdown = () => { active = true; };
        window.onpointermove = (e) => {
            if (!active) return;
            let rect = joy.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;
            let dx = e.clientX - centerX, dy = e.clientY - centerY;
            let dist = Math.hypot(dx, dy);
            if (dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            this.moveDir.x = dx / maxD;
            this.moveDir.y = dy / maxD;
        };
        window.onpointerup = () => {
            active = false;
            knob.style.transform = `translate(0px, 0px)`;
            this.moveDir.x = 0;
            this.moveDir.y = 0;
        };
    }

    addPlayer(p) {
        this.ship = this.physics.add.sprite(p.x, p.y, 'novice', 4);
        this.ship.setScale(1.1);
        this.ship.setCollideWorldBounds(true);
        this.cameras.main.startFollow(this.ship, true, 0.1, 0.1);
        this.nameText = this.add.text(0, -35, 'Novice (You)', { fontSize: '11px', fill: '#fde047', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    }

    addOther(p) {
        let o = this.physics.add.sprite(p.x, p.y, 'novice', 4);
        o.setScale(1.1);
        o.playerId = p.id;
        this.otherPlayers.add(o);
        this.add.text(0, -35, 'Novice', { fontSize: '10px', fill: '#fff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setX(p.x).setY(p.y - 35);
    }

    doAttack() {
        if (this.ship) {
            this.ship.anims.play('attack', true);
        }
    }

    update() {
        if (this.ship && this.ship.body) {
            let speed = 190;
            this.ship.setVelocity(this.moveDir.x * speed, this.moveDir.y * speed);

            if (this.nameText) {
                this.nameText.setPosition(this.ship.x, this.ship.y - 35);
            }

            if (this.moveDir.x !== 0 || this.moveDir.y !== 0) {
                this.ship.anims.play('walk', true);
                this.socket.emit('playerMovement', { x: this.ship.x, y: this.ship.y });
            } else {
                if (this.ship.anims.currentAnim && this.ship.anims.currentAnim.key === 'walk') {
                    this.ship.anims.play('idle', true);
                }
            }
        }
    }
}

// ฟังก์ชันส่งข้อความแชท
function sendChat() {
    let input = document.getElementById('chat-input');
    if (input.value.trim() !== '' && globalSocket) {
        globalSocket.emit('chatMessage', input.value);
        input.value = '';
    }
}

function triggerAttack() {
    if (game.scene.scenes[0] && typeof game.scene.scenes[0].doAttack === 'function') {
        game.scene.scenes[0].doAttack();
    }
}

const game = new Phaser.Game({
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: GameScene
});
</script>
</body>
</html>
