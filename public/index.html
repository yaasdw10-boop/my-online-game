<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel MMORPG Online</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #1a1c23; overflow: hidden; touch-action: none; font-family: Tahoma, sans-serif; }
        #joystick { position: fixed; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #knob { width: 55px; height: 55px; background: rgba(255,255,255,0.4); border-radius: 50%; position: absolute; }
        #ui-top { position: fixed; top: 10px; left: 10px; color: #ffd400; font-size: 12px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; border: 1px solid #5a6a9a; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>
<div id="ui-top">🛡️ RagnaWorld Online | Online</div>
<div id="joystick"><div id="knob"></div></div>

<script>
class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }
    
    preload() {
        // โหลดภาพสไปรท์พิกเซลอาร์ตตัวละครแนวแฟนตาซี (RPG Chibi Sprite)
        this.load.spritesheet('player', 'https://labs.phaser.io/assets/animations/dude.png', { frameWidth: 32, frameHeight: 48 });
        this.load.image('bg', 'https://labs.phaser.io/assets/skies/space3.png');
    }

    create() {
        // สร้างแผนที่พื้นหลัง
        this.add.tileSprite(0, 0, 4000, 4000, 'bg').setAlpha(0.7);

        // สร้างอนิเมชันเดิน
        this.anims.create({
            key: 'walk',
            frames: this.anims.generateFrameNumbers('player', { start: 0, end: 3 }),
            frameRate: 10,
            repeat: -1
        });
        this.anims.create({
            key: 'idle',
            frames: [{ key: 'player', frame: 4 }],
            frameRate: 10
        });

        this.socket = io();
        this.otherPlayers = this.physics.add.group();
        this.moveDir = { x: 0, y: 0 };
        this.cameras.main.setZoom(1.5); // ซูมให้เห็นภาพพิกเซลชัดเจนสไตล์เกมคอม

        this.socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === this.socket.id) this.addPlayer(players[id]);
                else this.addOther(players[id]);
            });
        });

        this.socket.on('newPlayer', (playerInfo) => this.addOther(playerInfo));
        this.socket.on('disconnectPlayer', (id) => {
            this.otherPlayers.getChildren().forEach(o => { if (o.playerId === id) o.destroy(); });
        });
        this.socket.on('playerMoved', (playerInfo) => {
            this.otherPlayers.getChildren().forEach(o => {
                if (o.playerId === playerInfo.id) {
                    o.setPosition(playerInfo.x, playerInfo.y);
                    o.anims.play('walk', true);
                }
            });
        });

        // ควบคุมผ่านจอยสติ๊กมือถือ
        let joy = document.getElementById('joystick'), knob = document.getElementById('knob');
        let active = false, maxD = 45;
        
        joy.onpointerdown = () => { active = true; };
        window.onpointermove = (e) => {
            if (!active) return;
            let dx = e.clientX - 95, dy = e.clientY - (window.innerHeight - 95);
            let dist = Math.hypot(dx, dy);
            if (dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            this.moveDir.x = dx / maxD;
            this.moveDir.y = dy / maxD;
        };
        window.onpointerup = () => {
            active = false; knob.style.transform = `translate(0px, 0px)`;
            this.moveDir.x = 0; this.moveDir.y = 0;
        };
    }

    addPlayer(p) {
        this.ship = this.physics.add.sprite(p.x, p.y, 'player', 4);
        this.ship.setScale(1.2);
        this.cameras.main.startFollow(this.ship, true, 0.1, 0.1);
        this.nameText = this.add.text(0, -32, 'Hero (You)', { fontSize: '11px', fill: '#fde047', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    }

    addOther(p) {
        let o = this.physics.add.sprite(p.x, p.y, 'player', 4);
        o.setScale(1.2);
        o.playerId = p.id;
        this.otherPlayers.add(o);
        this.add.text(0, -32, 'Adventurer', { fontSize: '10px', fill: '#fff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setX(p.x).setY(p.y - 32);
    }

    update() {
        if (this.ship) {
            let speed = 180;
            this.ship.setVelocity(this.moveDir.x * speed, this.moveDir.y * speed);

            if (this.nameText) {
                this.nameText.setPosition(this.ship.x, this.ship.y - 32);
            }

            if (this.moveDir.x !== 0 || this.moveDir.y !== 0) {
                this.ship.anims.play('walk', true);
                this.socket.emit('playerMovement', { x: this.ship.x, y: this.ship.y });
            } else {
                this.ship.anims.play('idle', true);
            }
        }
    }
}

new Phaser.Game({
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade' },
    scene: GameScene
});
</script>
</body>
</html>
