<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asura Online - Professional Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #1b3b18; overflow: hidden; touch-action: none; font-family: Tahoma, sans-serif; user-select: none; }
        
        #asura-top-bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: linear-gradient(to bottom, #2d3748, #1a202c); border-bottom: 2px solid #ecc94b; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; z-index: 30; box-shadow: 0 3px 10px rgba(0,0,0,0.8); }
        .top-left-info { display: flex; flex-direction: column; width: 140px; }
        .asura-bar-bg { background: #000; height: 6px; border: 1px solid #718096; border-radius: 2px; margin-top: 1px; overflow: hidden; position: relative; }
        #hp-bar { background: linear-gradient(to right, #e53e3e, #9b2c2c); width: 100%; height: 100%; transition: width 0.2s; }
        #sp-bar { background: linear-gradient(to right, #3182ce, #1a365d); width: 100%; height: 100%; transition: width 0.2s; }
        
        .top-skills { display: flex; gap: 3px; }
        .skill-slot { width: 30px; height: 30px; background: #2d3748; border: 2px solid #cbd5e1; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: bold; cursor: pointer; box-shadow: inset 0 2px 4px rgba(255,255,255,0.1); }
        .skill-slot:active { background: #4a5568; transform: scale(0.95); }

        #minimap { position: fixed; top: 50px; right: 8px; width: 100px; height: 80px; background: rgba(15,30,15,0.9); border: 2px solid #ecc94b; border-radius: 4px; z-index: 20; display: flex; align-items: center; justify-content: center; color: #68d391; font-size: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }

        #target-hud { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 2px solid #e53e3e; border-radius: 4px; padding: 4px 12px; color: #fff; font-size: 10px; z-index: 20; display: none; text-align: center; box-shadow: 0 4px 10px rgba(229,62,62,0.4); }

        #chat-container { position: fixed; bottom: 42px; left: 6px; width: 260px; height: 85px; background: rgba(0,0,0,0.8); border: 1px solid #718096; border-radius: 4px; padding: 4px; z-index: 25; display: flex; flex-direction: column; justify-content: flex-end; }
        #chat-box { font-size: 9px; color: #fff; overflow-y: auto; max-height: 55px; margin-bottom: 3px; word-break: break-all; }
        #chat-input-row { display: flex; gap: 3px; }
        #chat-input { flex: 1; background: rgba(255,255,255,0.9); border: none; border-radius: 2px; padding: 3px 6px; font-size: 9px; outline: none; }
        #chat-send { background: #3182ce; color: #fff; border: none; border-radius: 2px; padding: 3px 8px; font-size: 9px; cursor: pointer; font-weight: bold; }

        #joystick { position: fixed; bottom: 145px; left: 15px; width: 100px; height: 100px; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; z-index: 25; display: flex; align-items: center; justify-content: center; touch-action: none; }
        #knob { width: 40px; height: 40px; background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(180,180,180,0.9)); border-radius: 50%; position: absolute; pointer-events: none; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        #action-btn { position: fixed; bottom: 50px; right: 15px; width: 70px; height: 70px; background: radial-gradient(circle, #e53e3e, #822727); border: 3px solid #feb2b2; border-radius: 50%; z-index: 25; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: bold; box-shadow: 0 6px 15px rgba(0,0,0,0.7); cursor: pointer; }
        #skill-btn { position: fixed; bottom: 130px; right: 25px; width: 55px; height: 55px; background: radial-gradient(circle, #3182ce, #1a365d); border: 2px solid #90cdf4; border-radius: 50%; z-index: 25; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.6); cursor: pointer; }

        #asura-bottom-menu { position: fixed; bottom: 0; left: 0; right: 0; height: 38px; background: linear-gradient(to top, #1a202c, #2d3748); border-top: 2px solid #ecc94b; display: flex; align-items: center; justify-content: flex-end; z-index: 20; padding-right: 6px; gap: 4px; }
        .menu-btn { background: #2d3748; color: #e2e8f0; border: 1px solid #a0aec0; border-radius: 3px; padding: 4px 8px; font-size: 9px; font-weight: bold; cursor: pointer; }
        .menu-btn:active { background: #4a5568; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 290px; background: #2d3748; border: 2px solid #ecc94b; border-radius: 6px; padding: 12px; color: #fff; z-index: 100; font-size: 11px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal h3 { margin: 0 0 10px 0; color: #ecc94b; font-size: 12px; text-align: center; border-bottom: 1px solid #4a5568; padding-bottom: 5px; }
        .modal-close { position: absolute; top: 8px; right: 10px; color: #feb2b2; cursor: pointer; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; align-items: center; background: rgba(0,0,0,0.25); padding: 4px 8px; border-radius: 3px; }
        .stat-btn { background: #48bb78; border: none; color: #fff; font-weight: bold; padding: 2px 8px; border-radius: 2px; cursor: pointer; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 6px; border-radius: 3px; margin-bottom: 5px; }
        .equip-btn { background: #ecc94b; border: none; color: #000; font-weight: bold; padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 9px; }
        .use-btn { background: #e53e3e; border: none; color: #fff; font-weight: bold; padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 9px; }
    </style>
</head>
<body>

    <div id="asura-top-bar">
        <div class="top-left-info">
            <div style="font-size:9px; color:#ecc94b; font-weight:bold;"><span id="ui-name">Hero</span> <span style="color:#fff;">[LV.<span id="ui-lvl">1</span>]</span></div>
            <div style="font-size:7px; color:#cbd5e1;">HP: <span id="ui-hp">120</span>/<span id="ui-mhp">120</span></div>
            <div class="asura-bar-bg"><div id="hp-bar"></div></div>
            <div style="font-size:7px; color:#cbd5e1;">SP: <span id="ui-sp">60</span>/<span id="ui-msp">60</span></div>
            <div class="asura-bar-bg"><div id="sp-bar"></div></div>
        </div>
        <div class="top-skills">
            <div class="skill-slot" onclick="useActiveSkill()">F1</div>
            <div class="skill-slot" onclick="useActiveSkill()">F2</div>
            <div class="skill-slot" onclick="useActiveSkill()">F3</div>
            <div class="skill-slot" onclick="useItem('hp_potion')">💊</div>
            <div class="skill-slot" onclick="useItem('sp_potion')">🧪</div>
        </div>
    </div>

    <div id="minimap">📍 Prontera Field<br>(Pro World)</div>
    <div id="target-hud">🎯 เป้าหมาย: <span id="target-name">ไม่มี</span></div>

    <div id="chat-container">
        <div id="chat-box"><div>[ระบบ]: ยินดีต้อนรับสู่ Asura Online Professional!</div></div>
        <div id="chat-input-row">
            <input type="text" id="chat-input" placeholder="พิมพ์คุย...">
            <button id="chat-send" onclick="sendChat()">ส่ง</button>
        </div>
    </div>

    <div id="joystick"><div id="knob"></div></div>
    <div id="skill-btn" onclick="useActiveSkill()">⚡ Bash</div>
    <div id="action-btn" onclick="triggerAttack(false)">⚔️ ตี</div>

    <div id="inventory-modal" class="modal">
        <span class="modal-close" onclick="toggleModal('inventory-modal')">X</span>
        <h3>📦 ช่องเก็บของ & แฟชั่น</h3>
        <div id="inventory-list" style="max-height: 160px; overflow-y: auto;"></div>
    </div>

    <div id="stat-modal" class="modal">
        <span class="modal-close" onclick="toggleModal('stat-modal')">X</span>
        <h3>📊 สถานะตัวละคร (Status)</h3>
        <div style="font-size:9px; margin-bottom:6px;">แต้มคงเหลือ: <span id="stat-point" style="color:#48bb78; font-weight:bold;">0</span></div>
        <div class="stat-row"><span>STR: <b id="val-str">5</b></span> <button class="stat-btn" onclick="upgradeStat('str')">+</button></div>
        <div class="stat-row"><span>AGI: <b id="val-agi">5</b></span> <button class="stat-btn" onclick="upgradeStat('agi')">+</button></div>
        <div class="stat-row"><span>VIT: <b id="val-vit">5</b></span> <button class="stat-btn" onclick="upgradeStat('vit')">+</button></div>
        <div class="stat-row"><span>INT: <b id="val-int">5</b></span> <button class="stat-btn" onclick="upgradeStat('int')">+</button></div>
        <div class="stat-row"><span>DEX: <b id="val-dex">5</b></span> <button class="stat-btn" onclick="upgradeStat('dex')">+</button></div>
        <div class="stat-row"><span>LUK: <b id="val-luk">5</b></span> <button class="stat-btn" onclick="upgradeStat('luk')">+</button></div>
    </div>

    <div id="asura-bottom-menu">
        <button class="menu-btn" onclick="toggleModal('inventory-modal')">ไอเท็ม</button>
        <button class="menu-btn" onclick="toggleModal('stat-modal')">สถานะ</button>
        <button class="menu-btn" onclick="alert('หน้าต่างสกิล')">สกิล</button>
        <button class="menu-btn" onclick="alert('ระบบเควส')">เควส</button>
        <button class="menu-btn" onclick="alert('แผนที่โลก')">แผนที่</button>
    </div>

<script>
let globalSocket = null;
let myPlayerData = null;
let selectedTarget = null;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    let now = audioCtx.currentTime;
    if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'skill') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'potion') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'levelup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.setValueAtTime(700, now + 0.1);
        osc.frequency.setValueAtTime(1100, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }
    
    preload() {
        this.load.image('bg', 'https://labs.phaser.io/assets/skies/deep-blue.png');
    }

    create() {
        // สร้างแผนที่ทุ่งหญ้าธรรมชาติพร้อมลวดลายตารางไทล์
        this.add.tileSprite(0, 0, 6000, 6000, 'bg').setTint(0x2f855a).setAlpha(0.85);

        this.socket = io();
        globalSocket = this.socket;
        
        this.otherPlayers = this.physics.add.group();
        this.monstersGroup = this.physics.add.group();
        this.moveDir = { x: 0, y: 0 };
        this.cameras.main.setZoom(1.5);

        this.socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === this.socket.id) {
                    myPlayerData = players[id];
                    this.addPlayer(players[id]);
                    updateUI();
                } else {
                    this.addOther(players[id]);
                }
            });
        });

        this.socket.on('currentMonsters', (monsters) => {
            Object.keys(monsters).forEach(id => this.addMonster(monsters[id]));
        });

        this.socket.on('newPlayer', (p) => this.addOther(p));
        this.socket.on('disconnectPlayer', (id) => {
            this.otherPlayers.getChildren().forEach(o => {
                if (o.playerId === id) {
                    if(o.shadow) o.shadow.destroy();
                    o.destroy();
                }
            });
        });

        this.socket.on('playerMoved', (p) => {
            this.otherPlayers.getChildren().forEach(o => {
                if (o.playerId === p.id) {
                    o.setPosition(p.x, p.y);
                    if (o.shadow) o.shadow.setPosition(p.x, p.y + 18);
                    if (o.nameText) o.nameText.setPosition(p.x, p.y - 40);
                }
            });
        });

        this.socket.on('playerEquipChanged', (data) => {
            if (data.id === this.socket.id && this.ship) {
                this.updatePlayerCostume(this.ship, data.equipment);
            } else {
                this.otherPlayers.getChildren().forEach(o => {
                    if (o.playerId === data.id) this.updatePlayerCostume(o, data.equipment);
                });
            }
        });

        this.socket.on('updateStatsData', (p) => { myPlayerData = p; updateUI(); });
        this.socket.on('playerDataUpdated', (p) => { myPlayerData = p; updateUI(); });
        this.socket.on('updateInventory', (inv) => { if (myPlayerData) myPlayerData.inventory = inv; updateInventoryUI(); });

        this.socket.on('monsterDamaged', (data) => {
            playSound('hit');
            this.monstersGroup.getChildren().forEach(m => {
                if (m.monsterId === data.monsterId) {
                    showFloatingText(m.x, m.y - 20, `-${data.damage}`, '#e53e3e');
                    // เอฟเฟกต์กระพริบเมื่อโดนตี
                    this.tweens.add({ targets: m, alpha: 0.3, duration: 50, yoyo: true, repeat: 1 });
                }
            });
        });

        this.socket.on('monsterDead', (data) => {
            this.monstersGroup.getChildren().forEach(m => {
                if (m.monsterId === data.monsterId) {
                    showFloatingText(m.x, m.y - 20, `+${data.exp} EXP`, '#48bb78');
                    if (selectedTarget && selectedTarget.monsterId === data.monsterId) { clearTarget(); }
                    m.destroy();
                }
            });
            if (data.killerId === this.socket.id) {
                myPlayerData = data.player;
                if (data.leveledUp) { playSound('levelup'); showFloatingText(this.ship.x, this.ship.y - 60, 'LEVEL UP!', '#ecc94b'); }
                updateUI();
            }
        });

        this.socket.on('monsterRespawn', (m) => this.addMonster(m));

        this.socket.on('chatMessage', (data) => {
            let box = document.getElementById('chat-box');
            box.innerHTML += `<div><b>${data.name}:</b> ${data.msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        let joy = document.getElementById('joystick'), knob = document.getElementById('knob');
        let active = false, maxD = 35;

        joy.onpointerdown = () => { active = true; };
        window.onpointermove = (e) => {
            if (!active) return;
            let rect = joy.getBoundingClientRect();
            let dx = e.clientX - (rect.left + rect.width / 2);
            let dy = e.clientY - (rect.top + rect.height / 2);
            let dist = Math.hypot(dx, dy);
            if (dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            this.moveDir.x = dx / maxD;
            this.moveDir.y = dy / maxD;
        };
        window.onpointerup = () => {
            active = false;
            knob.style.transform = `translate(0px, 0px)`;
            this.moveDir.x = 0; this.moveDir.y = 0;
        };
    }

    addPlayer(p) {
        this.shipShadow = this.add.ellipse(p.x, p.y + 18, 22, 9, 0x000000, 0.45);
        this.ship = this.add.container(p.x, p.y);
        
        let body = this.add.rectangle(0, 4, 20, 24, 0x3182ce).setStrokeStyle(2, 0x1a365d);
        let head = this.add.circle(0, -14, 11, 0xffdead).setStrokeStyle(1, 0xd4b28c);
        let hair = this.add.ellipse(0, -20, 14, 8, 0x742a2a);
        let eyeLeft = this.add.circle(-3, -14, 1.5, 0x000000);
        let eyeRight = this.add.circle(3, -14, 1.5, 0x000000);

        this.ship.add([body, head, hair, eyeLeft, eyeRight]);
        this.physics.world.enable(this.ship);
        this.ship.body.setCollideWorldBounds(true);
        this.ship.body.setSize(20, 30);

        this.cameras.main.startFollow(this.ship, true, 0.1, 0.1);
        this.nameText = this.add.text(p.x, p.y - 40, `${p.name} (You)`, { fontSize: '9px', fill: '#ecc94b', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    }

    addOther(p) {
        let shadow = this.add.ellipse(p.x, p.y + 18, 22, 9, 0x000000, 0.45);
        let o = this.add.container(p.x, p.y);
        
        let body = this.add.rectangle(0, 4, 20, 24, 0x38a169).setStrokeStyle(2, 0x22543d);
        let head = this.add.circle(0, -14, 11, 0xffdead);
        let hair = this.add.ellipse(0, -20, 14, 8, 0x1a202c);
        let eyeLeft = this.add.circle(-3, -14, 1.5, 0x000000);
        let eyeRight = this.add.circle(3, -14, 1.5, 0x000000);

        o.add([body, head, hair, eyeLeft, eyeRight]);
        o.playerId = p.id;
        o.shadow = shadow;
        this.otherPlayers.add(o);
        o.nameText = this.add.text(p.x, p.y - 40, p.name, { fontSize: '9px', fill: '#fff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    }

    updatePlayerCostume(spriteObj, eq) {
        if (eq && eq.head) {
            if (!spriteObj.hat) {
                spriteObj.hat = this.add.ellipse(0, -28, 18, 12, 0xed64a6).setStrokeStyle(1, 0xffffff);
                spriteObj.add(spriteObj.hat);
            }
        } else if (spriteObj.hat) {
            spriteObj.hat.destroy();
            spriteObj.hat = null;
        }
    }

    addMonster(m) {
        let monsterSprite = this.add.container(m.x, m.y);
        let color = m.type === 'drops' ? 0x4299e1 : (m.type === 'lunatic' ? 0xfffaf0 : 0xed64a6);
        let body = this.add.circle(0, 0, 16, color).setStrokeStyle(2, 0xffffff);
        let eye1 = this.add.circle(-4, -3, 2, 0x000000);
        let eye2 = this.add.circle(4, -3, 2, 0x000000);
        let mouth = this.add.circle(0, 2, 1.5, 0x000000);
        monsterSprite.add([body, eye1, eye2, mouth]);

        monsterSprite.monsterId = m.id;
        this.physics.world.enable(monsterSprite);
        monsterSprite.body.setCircle(16, -16, -16);
        monsterSprite.setInteractive(new Phaser.Geom.Circle(0, 0, 18), Phaser.Geom.Circle.Contains);
        
        monsterSprite.on('pointerdown', () => {
            selectedTarget = monsterSprite;
            document.getElementById('target-hud').style.display = 'block';
            document.getElementById('target-name').innerText = `${m.name} [Lv.${m.level}]`;
        });

        this.monstersGroup.add(monsterSprite);
        this.add.text(m.x, m.y - 25, `${m.name} [Lv.${m.level}]`, { fontSize: '9px', fill: '#feb2b2', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5);
    }

    doAttack(isSkill = false) {
        if (this.ship) {
            // ท่าทางโจมตีพุ่งไปข้างหน้าและหมุนเอฟเฟกต์
            this.tweens.add({ targets: this.ship, scaleX: 1.25, scaleY: 0.75, duration: 70, yoyo: true });
            
            if (isSkill) { playSound('skill'); } else { playSound('hit'); }

            if (selectedTarget && selectedTarget.active) {
                let dist = Phaser.Math.Distance.Between(this.ship.x, this.ship.y, selectedTarget.x, selectedTarget.y);
                if (dist <= 130 && globalSocket) {
                    globalSocket.emit('attackMonster', { monsterId: selectedTarget.monsterId, isSkill: isSkill });
                } else {
                    showFloatingText(this.ship.x, this.ship.y - 50, 'เป้าหมายไกลเกินไป!', '#ecc94b');
                }
            } else {
                let nearestMonster = null;
                let minDist = 100;
                this.monstersGroup.getChildren().forEach(m => {
                    let dist = Phaser.Math.Distance.Between(this.ship.x, this.ship.y, m.x, m.y);
                    if (dist < minDist) { minDist = dist; nearestMonster = m; }
                });
                if (nearestMonster && globalSocket) {
                    globalSocket.emit('attackMonster', { monsterId: nearestMonster.monsterId, isSkill: isSkill });
                }
            }
        }
    }

    update() {
        if (this.ship && this.ship.body) {
            let speed = 190;
            this.ship.body.setVelocity(this.moveDir.x * speed, this.moveDir.y * speed);

            if (this.shipShadow) { this.shipShadow.setPosition(this.ship.x, this.ship.y + 18); }
            if (this.nameText) { this.nameText.setPosition(this.ship.x, this.ship.y - 40); }

            if (this.moveDir.x !== 0 || this.moveDir.y !== 0) {
                this.socket.emit('playerMovement', { x: this.ship.x, y: this.ship.y });
            }
        }
    }
}

function clearTarget() {
    selectedTarget = null;
    document.getElementById('target-hud').style.display = 'none';
}

function updateUI() {
    if (!myPlayerData) return;
    document.getElementById('ui-name').innerText = myPlayerData.name;
    document.getElementById('ui-lvl').innerText = myPlayerData.lvl;
    document.getElementById('ui-hp').innerText = myPlayerData.hp;
    document.getElementById('ui-mhp').innerText = myPlayerData.maxHp;
    document.getElementById('ui-sp').innerText = myPlayerData.sp;
    document.getElementById('ui-msp').innerText = myPlayerData.maxSp;
    
    document.getElementById('hp-bar').style.width = Math.floor((myPlayerData.hp / myPlayerData.maxHp) * 100) + '%';
    document.getElementById('sp-bar').style.width = Math.floor((myPlayerData.sp / myPlayerData.maxSp) * 100) + '%';

    document.getElementById('stat-point').innerText = myPlayerData.stats.statPoint;
    document.getElementById('val-str').innerText = myPlayerData.stats.str;
    document.getElementById('val-agi').innerText = myPlayerData.stats.agi;
    document.getElementById('val-vit').innerText = myPlayerData.stats.vit;
    document.getElementById('val-int').innerText = myPlayerData.stats.int;
    document.getElementById('val-dex').innerText = myPlayerData.stats.dex;
    document.getElementById('val-luk').innerText = myPlayerData.stats.luk;
    updateInventoryUI();
}

function updateInventoryUI() {
    if (!myPlayerData || !myPlayerData.inventory) return;
    let listEl = document.getElementById('inventory-list');
    listEl.innerHTML = '';
    myPlayerData.inventory.forEach(item => {
        let actionBtn = '';
        if (item.type === 'consumable') {
            actionBtn = `<button class="use-btn" onclick="useItem('${item.id}')">ใช้</button>`;
        } else if (item.type === 'costume') {
            actionBtn = `<button class="equip-btn" onclick="equipItem('${item.id}')">สวม</button>`;
        }
        listEl.innerHTML += `<div class="item-row"><span>${item.name} (${item.count})</span> ${actionBtn}</div>`;
    });
}

function toggleModal(id) {
    let modal = document.getElementById(id);
    modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
}

function upgradeStat(statName) { if (globalSocket) globalSocket.emit('upgradeStat', statName); }
function useItem(itemId) { playSound('potion'); if (globalSocket) globalSocket.emit('useItem', itemId); }
function equipItem(itemId) { if (globalSocket) globalSocket.emit('equipItem', itemId); }
function useActiveSkill() { triggerAttack(true); }
function triggerAttack(isSkill = false) { if (game.scene.scenes[0]) game.scene.scenes[0].doAttack(isSkill); }

function sendChat() {
    let input = document.getElementById('chat-input');
    if (input.value.trim() !== '' && globalSocket) {
        globalSocket.emit('chatMessage', input.value);
        input.value = '';
    }
}

function showFloatingText(x, y, message, color) {
    let scene = game.scene.scenes[0];
    let txt = scene.add.text(x, y, message, { fontSize: '12px', fill: color, stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    scene.tweens.add({ targets: txt, y: y - 35, alpha: 0, duration: 1000, onComplete: () => txt.destroy() });
}

const game = new Phaser.Game({
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: GameScene
});
</script>
