<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asura Online Web Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #1b2612; overflow: hidden; touch-action: none; font-family: Tahoma, sans-serif; user-select: none; }
        
        /* UI HUD มุมซ้ายบน (เลเวล หลอดเลือด HP/SP) */
        #ui-top-left { position: fixed; top: 8px; left: 8px; background: rgba(0,0,0,0.85); border: 2px solid #555; border-radius: 4px; padding: 6px 10px; color: #fff; font-size: 11px; z-index: 20; width: 210px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .bar-container { background: #333; height: 8px; border-radius: 2px; margin-top: 3px; position: relative; overflow: hidden; border: 1px solid #111; }
        #hp-bar { background: #e74c3c; width: 100%; height: 100%; }
        #sp-bar { background: #3498db; width: 100%; height: 100%; }
        
        /* Minimap ขวาบน */
        #minimap { position: fixed; top: 8px; right: 8px; width: 110px; height: 90px; background: rgba(15,23,42,0.9); border: 2px solid #475569; border-radius: 4px; z-index: 20; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 10px; }

        /* กล่องแชทล่างซ้าย */
        #chat-container { position: fixed; bottom: 50px; left: 8px; width: 280px; height: 85px; background: rgba(0,0,0,0.7); border: 1px solid #444; border-radius: 4px; padding: 4px; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
        #chat-box { font-size: 10px; color: #fff; overflow-y: auto; max-height: 60px; margin-bottom: 3px; word-break: break-all; }
        #chat-input-row { display: flex; gap: 4px; }
        #chat-input { flex: 1; background: rgba(255,255,255,0.9); border: none; border-radius: 2px; padding: 2px 4px; font-size: 10px; }
        #chat-send { background: #2563eb; color: #fff; border: none; border-radius: 2px; padding: 2px 8px; font-size: 10px; cursor: pointer; }

        /* แถบเมนูลัดด้านล่างสุด (สไตล์ Asura) */
        #bottom-menu { position: fixed; bottom: 0; left: 0; right: 0; height: 42px; background: linear-gradient(to top, #111, #222); border-top: 2px solid #444; display: flex; align-items: center; justify-content: space-around; z-index: 20; padding: 0 4px; }
        .menu-btn { background: #333; color: #facc15; border: 1px solid #555; border-radius: 3px; padding: 4px 8px; font-size: 10px; font-weight: bold; cursor: pointer; }

        /* จอยสติ๊กบังคับทิศทางโปร่งใส */
        #joystick { position: fixed; bottom: 55px; right: 20px; width: 110px; height: 110px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #knob { width: 45px; height: 45px; background: rgba(255,255,255,0.3); border-radius: 50%; position: absolute; }
    </style>
</head>
<body>

    <!-- UI มุมซ้ายบน -->
    <div id="ui-top-left">
        <div><b>[Novice]</b> Hero | <span style="color:#facc15;">LV. 15</span></div>
        <div style="font-size:9px; color:#aaa;">HP: 240/240</div>
        <div class="bar-container"><div id="hp-bar"></div></div>
        <div style="font-size:9px; color:#aaa; margin-top:2px;">SP: 85/85</div>
        <div class="bar-container"><div id="sp-bar"></div></div>
    </div>

    <!-- Minimap ขวาบน -->
    <div id="minimap">📍 Map: Baan-Noob</div>

    <!-- กล่องแชทล่างซ้าย -->
    <div id="chat-container">
        <div id="chat-box">
            <div>[ระบบ]: ยินดีต้อนรับสู่ Asura Online Web!</div>
        </div>
        <div id="chat-input-row">
            <input type="text" id="chat-input" placeholder="พิมพ์ข้อความ...">
            <button id="chat-send" onclick="sendChat()">ส่ง</button>
        </div>
    </div>

    <!-- จอยสติ๊กขวา -->
    <div id="joystick"><div id="knob"></div></div>

    <!-- แถบเมนูลัดด้านล่าง -->
    <div id="bottom-menu">
        <button class="menu-btn" onclick="alert('ช่องเก็บของ (Inventory)')">📦 กระเป๋า</button>
        <button class="menu-btn" onclick="alert('สถานะตัวละคร (Status)')">📊 สเตตัส</button>
        <button class="menu-btn" onclick="alert('สกิล (Skills)')">⚡ สกิล</button>
        <button class="menu-btn" onclick="alert('ปาร์ตี้ (Party)')">👥 ปาร์ตี้</button>
        <button class="menu-btn" onclick="alert('ตั้งค่าระบบ (Option)')">⚙️ ตั้งค่า</button>
    </div>

<script>
class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }
    
    preload() {
        this.load.image('hero', 'https://labs.phaser.io/assets/sprites/car.png');
        this.load.image('other', 'https://labs.phaser.io/assets/sprites/ufo.png');
        this.load.image('bg', 'https://labs.phaser.io/assets/skies/space3.png');
    }

    create() {
        this.add.tileSprite(0, 0, 5000, 5000, 'bg').setAlpha(0.6);

        this.socket = io();
        this.otherPlayers = this.physics.add.group();
        this.moveDir = { x: 0, y: 0 };
        this.cameras.main.setZoom(1.3);

        this.socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach(id => {
                if (id === this.socket.id) this.addPlayer(players[id]);
                else this.addOther(players[id]);
            });
        });

        this.socket.on('newPlayer', (playerInfo) => this.addOther(playerInfo));
        this.socket.on('disconnectPlayer', (id) => {
            this.otherPlayers.getChildren().forEach(o => { if (o.playerId === id) o.destroy(); });
        });
        this.socket.on('playerMoved', (playerInfo) => {
            this.otherPlayers.getChildren().forEach(o => {
                if (o.playerId === playerInfo.id) o.setPosition(playerInfo.x, playerInfo.y);
            });
        });

        this.socket.on('chatMessage', (data) => {
            let box = document.getElementById('chat-box');
            box.innerHTML += `<div><b>${data.name}:</b> ${data.msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        // ควบคุมจอยสติ๊ก
        let joy = document.getElementById('joystick'), knob = document.getElementById('knob');
        let active = false, maxD = 40;
        
        joy.onpointerdown = () => { active = true; };
        window.onpointermove = (e) => {
            if (!active) return;
            let rect = joy.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;
            let dx = e.clientX - centerX, dy = e.clientY - centerY;
            let dist = Math.hypot(dx, dy);
            if (dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            this.moveDir.x = dx / maxD;
            this.moveDir.y = dy / maxD;
        };
        window.onpointerup = () => {
            active = false; knob.style.transform = `translate(0px, 0px)`;
            this.moveDir.x = 0; this.moveDir.y = 0;
        };
    }

    addPlayer(p) {
        this.ship = this.physics.add.sprite(p.x, p.y, 'hero');
        this.ship.setCollideWorldBounds(true);
        this.cameras.main.startFollow(this.ship, true, 0.1, 0.1);
        this.nameText = this.add.text(0, -32, 'Hero (You)', { fontSize: '11px', fill: '#fde047', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    }

    addOther(p) {
        let o = this.physics.add.sprite(p.x, p.y, 'other');
        o.playerId = p.id;
        this.otherPlayers.add(o);
        this.add.text(0, -32, 'Player', { fontSize: '10px', fill: '#fff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setX(p.x).setY(p.y - 32);
    }

    update() {
        if (this.ship) {
            let speed = 200;
            this.ship.setVelocity(this.moveDir.x * speed, this.moveDir.y * speed);

            if (this.nameText) {
                this.nameText.setPosition(this.ship.x, this.ship.y - 32);
            }

            if (this.moveDir.x !== 0 || this.moveDir.y !== 0) {
                this.socket.emit('playerMovement', { x: this.ship.x, y: this.ship.y });
            }
        }
    }
}

function sendChat() {
    let input = document.getElementById('chat-input');
    if (input.value.trim() !== '') {
        // ส่งข้อความผ่าน Socket (ต้องอิงตัวแปร socket ในฉาก หรือสร้างฟังก์ชันกลาง)
        input.value = '';
    }
}

new Phaser.Game({
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: 'arcade' },
    scene: GameScene
});
</script>
</body>
</html>
